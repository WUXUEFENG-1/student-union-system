<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云南工业信息职业学院应用经济系学生会管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231657a6'/%3E%3Ctext x='16' y='21' font-size='15' fill='white' text-anchor='middle' font-family='sans-serif'%3E%E5%AD%A6%3C/text%3E%3C/svg%3E">

<body>

<!-- ============ 登录页 ============ -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-badge big"></div>
      <div class="brand-col">
        <span class="brand-school">云南工业信息职业学院</span>
        <strong>应用经济系学生会管理系统</strong>
      </div>
    </div>
    <h1>账号登录</h1>
    <div class="field">
      <label>账号</label>
      <input id="loginUser" autocomplete="username" placeholder="请输入账号">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <p class="login-err hidden" id="loginErr"></p>
    <p id="cloudStatus" style="margin:6px 0;font-size:13px;text-align:center;">正在连接云端…</p>
    <button class="primary-btn block" id="loginBtn">登 录</button>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div class="app hidden" id="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-badge"></div>
      <div class="brand-text">
        <span class="brand-school">云南工业信息职业学院</span>
        <strong>应用经济系学生会管理系统</strong>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-card">
        <span class="mini-avatar" id="userAvatar">吴</span>
        <div>
          <strong id="userName">吴雪枫</strong>
          <span id="userTitle">主席 · 主席团</span>
        </div>
      </div>
      <button class="ghost-btn" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">工作台</h1>
        <p id="pageSub">今日待办与审批概览</p>
      </div>
      <div class="topbar-right">
        <span class="role-badge" id="roleBadge">主席团</span>
        <span class="date-badge" id="today"></span>
      </div>
    </header>
    <div id="views"></div>
  </main>
</div>

<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="ghost-btn" id="modalCancel">取消</button>
      <button class="primary-btn" id="modalOk">保存</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
