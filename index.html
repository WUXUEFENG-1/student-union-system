<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生会信息管理系统 | 应用经济学院</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">学</div>
      <div class="brand-text">
        <strong>学生会信息管理系统</strong>
        <span>应用经济学院</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>工作台</button>
      <button class="nav-item" data-view="members">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6.2M17 20c0-2.6-.8-4.4-2-5.2"/></svg>成员与部门</button>
      <button class="nav-item" data-view="activities">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5M8 14h3"/></svg>活动与报名</button>
      <button class="nav-item" data-view="notices">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5v3a2 2 0 0 0 2 2h2l5 4V4.5L8 8.5H6a2 2 0 0 0-2 2z"/><path d="M17 8.5a5 5 0 0 1 0 7"/></svg>通知公告</button>
      <button class="nav-item" data-view="attendance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.2l2.8 2.8L16.5 9"/></svg>考勤签到</button>
      <button class="nav-item" data-view="assets">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.2l8.5-4 8.5 4-8.5 4z"/><path d="M3.5 8.2v7.6l8.5 4 8.5-4V8.2M12 12.2v7.6"/></svg>物资借还</button>
    </nav>
    <div class="sidebar-foot">
      <button class="ghost-btn" id="exportBtn">导出数据</button>
      <button class="ghost-btn danger" id="resetBtn">恢复演示数据</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">工作台</h1>
        <p id="pageSub">学生会日常事务总览</p>
      </div>
      <div class="topbar-right">
        <span class="date-badge" id="today"></span>
        <div class="avatar">吴</div>
      </div>
    </header>

    <section class="view" id="view-dashboard"></section>
    <section class="view hidden" id="view-members"></section>
    <section class="view hidden" id="view-activities"></section>
    <section class="view hidden" id="view-notices"></section>
    <section class="view hidden" id="view-attendance"></section>
    <section class="view hidden" id="view-assets"></section>
  </main>
</div>

<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="ghost-btn" id="modalCancel">取消</button>
      <button class="primary-btn" id="modalOk">保存</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
